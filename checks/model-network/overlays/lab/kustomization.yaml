{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "namespace": "intro-openshift-ai",
  "resources": [
    "../../base"
  ],
  "patches": [
    {
      "target": {
        "kind": "Job"
      },
      "patch": "- op: add\n  path: /spec/template/spec/nodeSelector\n  value:\n    kubernetes.io/hostname: gpu-worker-01\n"
    }
  ]
}
