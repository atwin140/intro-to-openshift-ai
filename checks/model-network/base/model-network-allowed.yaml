{
  "apiVersion": "batch/v1",
  "kind": "Job",
  "metadata": {
    "name": "model-network-allowed"
  },
  "spec": {
    "backoffLimit": 0,
    "activeDeadlineSeconds": 180,
    "template": {
      "metadata": {
        "labels": {
          "app": "model-network-allowed",
          "intro-ai-model-client": "true"
        }
      },
      "spec": {
        "serviceAccountName": "model-server",
        "automountServiceAccountToken": false,
        "restartPolicy": "Never",
        "securityContext": {
          "runAsNonRoot": true
        },
        "containers": [
          {
            "name": "check",
            "image": "registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808",
            "command": [
              "python",
              "/scripts/check.py"
            ],
            "env": [
              {
                "name": "EXPECT_BLOCKED",
                "value": "false"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "256Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "runAsNonRoot": true,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "volumeMounts": [
              {
                "name": "script",
                "mountPath": "/scripts",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "script",
            "configMap": {
              "name": "model-network-check"
            }
          }
        ]
      }
    }
  }
}
