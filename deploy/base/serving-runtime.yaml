{
  "apiVersion": "serving.kserve.io/v1alpha1",
  "kind": "ServingRuntime",
  "metadata": {
    "annotations": {
      "opendatahub.io/recommended-accelerators": "[\"nvidia.com/gpu\"]",
      "opendatahub.io/runtime-version": "v0.24.0",
      "openshift.io/display-name": "Lab vLLM \u2014 Qwen2.5 Coder 7B AWQ"
    },
    "labels": {
      "opendatahub.io/dashboard": "true"
    },
    "name": "lab-vllm"
  },
  "spec": {
    "annotations": {
      "opendatahub.io/kserve-runtime": "vllm",
      "prometheus.io/path": "/metrics",
      "prometheus.io/port": "8080"
    },
    "containers": [
      {
        "args": [
          "--port=8080",
          "--model=/mnt/models",
          "--served-model-name={{.Name}}",
          "--dtype=float16",
          "--max-model-len=16384",
          "--max-num-seqs=2",
          "--max-num-batched-tokens=4096",
          "--gpu-memory-utilization=0.90",
          "--enforce-eager",
          "--generation-config=vllm",
          "--override-generation-config={\"max_new_tokens\":2048}",
          "--quantization=awq"
        ],
        "command": [
          "python",
          "-m",
          "vllm.entrypoints.openai.api_server"
        ],
        "env": [
          {
            "name": "HF_HOME",
            "value": "/tmp/hf_home"
          },
          {
            "name": "HF_HUB_OFFLINE",
            "value": "1"
          },
          {
            "name": "VLLM_NO_USAGE_STATS",
            "value": "1"
          },
          {
            "name": "DO_NOT_TRACK",
            "value": "1"
          }
        ],
        "image": "registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808",
        "name": "kserve-container",
        "ports": [
          {
            "containerPort": 8080,
            "protocol": "TCP"
          }
        ],
        "securityContext": {
          "allowPrivilegeEscalation": false,
          "capabilities": {
            "drop": [
              "ALL"
            ]
          },
          "runAsNonRoot": true,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "volumeMounts": [
          {
            "name": "shm",
            "mountPath": "/dev/shm"
          },
          {
            "name": "no-api-credentials",
            "mountPath": "/var/run/secrets/kubernetes.io/serviceaccount",
            "readOnly": true
          }
        ],
        "startupProbe": {
          "httpGet": {
            "path": "/health",
            "port": 8080
          },
          "periodSeconds": 10,
          "failureThreshold": 90
        },
        "readinessProbe": {
          "httpGet": {
            "path": "/health",
            "port": 8080
          },
          "periodSeconds": 10,
          "failureThreshold": 3
        }
      }
    ],
    "multiModel": false,
    "supportedModelFormats": [
      {
        "autoSelect": true,
        "name": "vLLM"
      }
    ]
  }
}
