apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: command-helper
  labels:
    networking.kserve.io/visibility: exposed
  annotations:
    security.opendatahub.io/enable-auth: "true"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-ingress
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              intro-ai-model-client: "true"
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8443
