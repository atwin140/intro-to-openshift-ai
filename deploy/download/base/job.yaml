{
  "apiVersion": "batch/v1",
  "kind": "Job",
  "metadata": {
    "name": "download-model"
  },
  "spec": {
    "backoffLimit": 0,
    "activeDeadlineSeconds": 3600,
    "template": {
      "metadata": {
        "labels": {
          "app": "model-download"
        }
      },
      "spec": {
        "serviceAccountName": "model-server",
        "automountServiceAccountToken": false,
        "restartPolicy": "Never",
        "securityContext": {
          "runAsNonRoot": true
        },
        "containers": [
          {
            "name": "download",
            "image": "registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808",
            "command": [
              "python",
              "/scripts/download.py"
            ],
            "env": [
              {
                "name": "HF_HOME",
                "value": "/tmp/hf-home"
              },
              {
                "name": "HF_HUB_DISABLE_IMPLICIT_TOKEN",
                "value": "1"
              },
              {
                "name": "HF_HUB_OFFLINE",
                "value": "0"
              },
              {
                "name": "TRANSFORMERS_OFFLINE",
                "value": "0"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "1",
                "memory": "2Gi"
              },
              "limits": {
                "cpu": "2",
                "memory": "4Gi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "runAsNonRoot": true,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "volumeMounts": [
              {
                "name": "models",
                "mountPath": "/models"
              },
              {
                "name": "script",
                "mountPath": "/scripts",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "models",
            "persistentVolumeClaim": {
              "claimName": "model-cache"
            }
          },
          {
            "name": "script",
            "configMap": {
              "name": "model-download-script"
            }
          }
        ]
      }
    }
  }
}
