    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#203342;background:#f4f7f8;font-size:16px}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:32px 24px 16px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:14px}.mark{display:grid;place-items:center;background:#087e80;color:white;width:46px;height:46px;border-radius:14px;font-size:26px;font-weight:700}h1{font-size:23px;margin:0;letter-spacing:-.7px}header p{font-size:13px;color:#617582;margin:5px 0}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:11px 17px;background:#087e80;color:white;font-weight:600}button:hover{filter:brightness(.94)}button:disabled{opacity:.5;cursor:wait}.secondary{background:white;color:#344f5e;border:1px solid #d6e1e6;font-size:13px}.notice{font-size:13px;line-height:1.6;background:#eaf2f3;border:1px solid #d9e7e8;border-radius:10px;padding:12px 16px;margin:25px 0 0}#messages{min-height:350px;padding:28px 0}#welcome{padding:42px 10px 30px;text-align:center}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:#087e80}h2{font-size:30px;letter-spacing:-1px;margin:15px 0 8px}#welcome p{color:#697c88;font-size:15px}.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:24px}.suggestions button{font-size:13px;font-weight:400;background:white;color:#365361;border:1px solid #d7e2e7}.label{font-size:11px;font-weight:700;letter-spacing:.4px;color:#657b88;margin-bottom:10px}article{border-radius:14px;padding:18px 20px;line-height:1.65;font-size:14px;margin-bottom:18px;overflow-wrap:anywhere}article p{white-space:pre-wrap;margin:0 0 10px}article p:last-child{margin:0}.user{background:#e1efef;margin-left:15%}.assistant{background:white;border:1px solid #dfe7eb;margin-right:4%}.codebox{position:relative;background:#172c3a;color:#e1eff1;border-radius:9px;margin:14px 0;padding:36px 14px 12px}pre{margin:0;overflow-x:auto;font-size:12px;line-height:1.7;white-space:pre}code{font-family:ui-monospace,monospace}.copy{position:absolute;top:7px;right:8px;background:#2c4657;font-size:11px;padding:4px 9px}form{border:1px solid #b5ccd1;background:white;border-radius:14px;padding:14px;box-shadow:0 4px 18px #15333b08}textarea{font:inherit;font-size:15px;resize:vertical;min-height:58px;max-height:180px;border:0;outline:0;width:100%;background:transparent;color:#203342}.composer-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}#status{font-size:12px;color:#6e818d}footer{text-align:center;font-size:11px;color:#6e818d;padding:15px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}button:focus-visible,textarea:focus-visible{outline:2px solid #087e80;outline-offset:3px}@media(max-width:600px){main{padding:18px 12px}h1{font-size:20px}.notice{font-size:12px}h2{font-size:25px}.user{margin-left:7%}.assistant{margin-right:0}#status{max-width:200px}#welcome{padding-top:25px}}
