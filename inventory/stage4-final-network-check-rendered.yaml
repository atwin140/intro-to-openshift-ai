apiVersion: v1
data:
  check.py: |
    import os, socket, urllib.request
    host='command-helper-predictor.intro-openshift-ai.svc.cluster.local'
    socket.getaddrinfo(host,8080)
    blocked=os.environ['EXPECT_BLOCKED']=='true'
    try:
     with urllib.request.urlopen('http://'+host+':8080/health',timeout=8) as r:
      assert r.status==200
    except (TimeoutError, urllib.error.URLError) as e:
     reason=getattr(e,'reason',e)
     if not blocked or not isinstance(reason,(TimeoutError,socket.timeout)): raise
     print('DENIED-CLIENT-TIMED-OUT-AS-EXPECTED',flush=True)
    else:
     if blocked: raise RuntimeError('Unlabeled client unexpectedly reached model')
     print('ALLOWED-CLIENT-HEALTH-PASSED',flush=True)
kind: ConfigMap
metadata:
  name: model-network-check-8tdfk2kdbt
  namespace: intro-openshift-ai
---
apiVersion: batch/v1
kind: Job
metadata:
  name: model-network-allowed
  namespace: intro-openshift-ai
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: model-network-allowed
        intro-ai-model-client: "true"
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python
        - /scripts/check.py
        env:
        - name: EXPECT_BLOCKED
          value: "false"
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
        name: check
        resources:
          limits:
            cpu: "1"
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /scripts
          name: script
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: gpu-node-01
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      serviceAccountName: model-server
      volumes:
      - configMap:
          name: model-network-check-8tdfk2kdbt
        name: script
---
apiVersion: batch/v1
