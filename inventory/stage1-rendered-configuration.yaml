apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
spec:
  ccManager:
    enabled: false
  cdi:
    enabled: true
    nriPluginEnabled: false
  daemonsets:
    rollingUpdate:
      maxUnavailable: "1"
    updateStrategy: RollingUpdate
  dcgm:
    enabled: true
  dcgmExporter:
    config:
      name: ""
    enabled: true
    serviceMonitor:
      enabled: true
  devicePlugin:
    config:
      default: ""
      name: ""
    enabled: true
    mps:
      root: /run/nvidia/mps
  driver:
    certConfig:
      name: ""
    enabled: true
    image: driver
    kernelModuleConfig:
      name: ""
    kernelModuleType: open
    licensingConfig:
      nlsEnabled: true
      secretName: ""
    repoConfig:
      configMapName: ""
    repository: nvcr.io/nvidia
    upgradePolicy:
      autoUpgrade: false
      drain:
        deleteEmptyDir: false
        enable: false
        force: false
        timeoutSeconds: 300
      maxParallelUpgrades: 1
      maxUnavailable: 25%
      podDeletion:
        deleteEmptyDir: false
        force: false
        timeoutSeconds: 300
      waitForCompletion:
        timeoutSeconds: 0
    useNvidiaDriverCRD: false
    version: sha256:e243d778bd83de47668e7629d78f673317a130fedc99941be12aad7fc6bdfa85
    virtualTopology:
      config: ""
  gdrcopy:
    enabled: false
  gds:
    enabled: false
  gfd:
    enabled: true
  kataSandboxDevicePlugin:
    enabled: false
  mig:
    strategy: none
  migManager:
    enabled: false
  nodeStatusExporter:
    enabled: true
  operator:
    use_ocp_driver_toolkit: true
  sandboxDevicePlugin:
    enabled: false
  sandboxWorkloads:
    defaultWorkload: container
    enabled: false
    mode: kubevirt
  toolkit:
    enabled: true
  validator:
    plugin:
      env: []
  vfioManager:
    enabled: false
  vgpuDeviceManager:
    enabled: false
  vgpuManager:
    enabled: false
