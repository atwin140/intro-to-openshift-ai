apiVersion: v1
kind: Pod
metadata:
  name: storage-check-write
  namespace: intro-openshift-ai
spec:
  activeDeadlineSeconds: 300
  automountServiceAccountToken: false
  containers:
  - command:
    - /bin/bash
    - -c
    - set -eu; printf "intro-ai-storage-check\n" > /data/check.txt; sync; test "$(cat
      /data/check.txt)" = intro-ai-storage-check; echo WRITE-PASSED
    image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:392e9833715141f9fc2f4dbe6f622a950755fd2ae5e78fd31c78f558ea3e74b5
    name: check
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    volumeMounts:
    - mountPath: /data
      name: data
  nodeSelector:
    kubernetes.io/hostname: gpu-node-01
  restartPolicy: Never
  securityContext:
    fsGroup: 1000880000
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: storage-handoff-check
