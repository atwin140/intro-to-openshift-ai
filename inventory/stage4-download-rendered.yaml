apiVersion: v1
data:
  download.py: |
    import importlib.metadata, json, pathlib, torch
    from huggingface_hub import snapshot_download
    print("vllm", importlib.metadata.version("vllm"), "torch",torch.__version__, "CUDA build",torch.version.cuda, flush=True)
    path = snapshot_download(repo_id="Qwen/Qwen3-4B-Instruct-2507", revision="cdbee75f17c01a7cc42f958dc650907174af0554", local_dir="/models/qwen3-4b", allow_patterns=["*.json","*.safetensors","*.txt","LICENSE","README.md"], max_workers=3)
    index=json.loads(pathlib.Path(path,"model.safetensors.index.json").read_text())
    for name in set(index["weight_map"].values()):
     assert pathlib.Path(path,name).stat().st_size > 0, name
    pathlib.Path(path,"REVISION").write_text("cdbee75f17c01a7cc42f958dc650907174af0554\n")
    print("DOWNLOAD-VERIFIED",path,"weight_bytes",index["metadata"]["total_size"],flush=True)
kind: ConfigMap
metadata:
  name: model-download-script-cg6b982m8b
  namespace: intro-openshift-ai
---
apiVersion: batch/v1
kind: Job
metadata:
  name: download-qwen3-4b
  namespace: intro-openshift-ai
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: model-download
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python
        - /scripts/download.py
        env:
        - name: HF_HOME
          value: /tmp/hf-home
        - name: HF_HUB_DISABLE_IMPLICIT_TOKEN
          value: "1"
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
        name: download
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "1"
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /models
          name: models
        - mountPath: /scripts
          name: script
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: gpu-node-01
      restartPolicy: Never
      securityContext:
        fsGroup: 1000880000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
      serviceAccountName: model-server
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: model-cache
      - configMap:
          name: model-download-script-cg6b982m8b
        name: script
